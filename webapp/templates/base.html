<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ project_name }}{% endblock %}</title>
    <!-- Local Stylesheet (Dark Theme) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Local Chart.js (Completely Offline) -->
    <script src="{{ url_for('static', filename='js/chart.umd.min.js') }}"></script>
</head>
<body class="app-body">
    <!-- Fixed Left Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <span class="brand-title">Campus Feedback</span>
                <span class="brand-subtitle">NLP Analysis System</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="{{ url_for('home') }}" class="nav-item {% if active_page == 'home' %}active{% endif %}">
                <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span class="nav-label">Home</span>
            </a>
            <a href="{{ url_for('demo') }}" class="nav-item {% if active_page == 'demo' %}active{% endif %}">
                <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                <span class="nav-label">Live Demo</span>
            </a>
            <a href="{{ url_for('explorer') }}" class="nav-item {% if active_page == 'explorer' %}active{% endif %}">
                <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <span class="nav-label">Facility Explorer</span>
            </a>
            <a href="{{ url_for('ratings') }}" class="nav-item {% if active_page == 'ratings' %}active{% endif %}">
                <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>
                <span class="nav-label">Aspect-wise Ratings</span>
            </a>
            <a href="{{ url_for('issues') }}" class="nav-item {% if active_page == 'issues' %}active{% endif %}">
                <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span class="nav-label">Recurring Issues</span>
            </a>
            <a href="{{ url_for('briefs') }}" class="nav-item {% if active_page == 'briefs' %}active{% endif %}">
                <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                <span class="nav-label">Facility Briefs</span>
            </a>
            <a href="{{ url_for('abusive') }}" class="nav-item {% if active_page == 'abusive' %}active{% endif %}">
                <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <span class="nav-label">Abusive Content</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span class="status-text">DistilBERT + Toxic-BERT</span>
            </div>
        </div>
    </aside>

    <!-- Main Content Viewport (Fits in single screen, scrolls inside cards) -->
    <main class="main-viewport">
        <div class="viewport-inner">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Local JavaScript -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
